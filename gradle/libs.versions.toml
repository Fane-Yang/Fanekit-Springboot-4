[versions]
#kotlin = "1.9.25"
kotlin = "2.3.10"
spring-boot = "4.0.3"
spring-kafka = "4.0.3"
spring-dependency-management = "1.1.7"
junit = "5.10.0"
# 添加 GraalVM Native 插件版本，用于打包二进制
graalvm-native = "0.10.6"

androidx-lifecycle = "2.8.4"
compose-multiplatform = "1.7.0"
kotlinx-coroutines = "1.10.2"

logback = "1.5.32"
# JDBC数据库依赖驱动版本号
ojdbc8 = "23.26.1.0.0"
ojdbc11 = "23.26.1.0.0"
# postgresql 驱动版本号
postgresql = "42.7.10"
# mysql 驱动版本号
mysql = "9.6.0"

jedis = "5.1.5"
fastjson2 = "2.0.61"
#io-github-smiley4 = "5.1.0"
mybatis = "3.5.19"
#mybatis-plus = "3.5.12"
#mybatis-plus-join = "1.5.3"

mybatis-flex-core = "1.11.6"
mybatis-flex-kotlin-extensions = "1.1.3"
hikariCP = "6.2.1"
orai18n="23.6.0.24.10"
rabbitMQ="5.24.0"
reflect="2.1.0"
lombok="1.18.36"
hutool="5.8.35"
okhttp="5.3.2"
quartz="2.5.2"
# koin依赖注入框架
#koin="4.1.0"
# jwt认证相关
auth0-jwt = "4.4.0"
# 对象连接池库
commons-pool2 = "2.13.1"
# sshj 提供SSH 客户端功能
sshj = "0.40.0"
# zip4j 用于处理zip文件
zip4j = "2.11.5"
# kafka-clients
kafka-clients = "4.2.0"

# BouncyCastle 加密库 (用于 SM2/SM3 等国密算法)
bouncycastle = "1.81"

# slf4j
# // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
slf4j = "2.0.17"

# kotlin js框架
kvision="8.1.0"
fritz2="1.0-RC19.5"

# shadow插件版本，用于包名重定向
shadow="8.1.1"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
# Spring Data Redis 相关依赖
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka", version.ref = "spring-boot" }

# spring kafka // https://mvnrepository.com/artifact/org.springframework.kafka/spring-kafka
#implementation("org.springframework.kafka:spring-kafka:4.0.0-M4")
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "spring-kafka" }


spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging", version.ref = "spring-boot" }
# Spring WebFlux 与相关依赖
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
# 数据库模块必须引入这个sprinb-boot 相关jdbc
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
reactor-kotlin-extensions = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions" }
reactor-test = { module = "io.projectreactor:reactor-test" }

# Kotlin 协程集成（使用已定义的 kotlinx-coroutines 版本）
kotlinx-coroutines-reactor = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# JDBC数据库依赖
jdbc-ojdbc8 = { module = "com.oracle.database.jdbc:ojdbc8", version.ref = "ojdbc8" }
jdbc-ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc11" }
jdbc-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jdbc-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
# jedis依赖 用于连接redis
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

# alibaba fastjson2依赖
fastjson2 = { module = "com.alibaba.fastjson2:fastjson2", version.ref = "fastjson2" }
fastjson2-kotlin = { module = "com.alibaba.fastjson2:fastjson2-kotlin", version.ref = "fastjson2" }
# mybatis 基础
mybatis = { module = "org.mybatis:mybatis", version.ref = "mybatis" }
# MyBatis Flex 相关依赖
mybatis-flex-core = { module = "com.mybatis-flex:mybatis-flex-core", version.ref = "mybatis-flex-core" }
mybatis-flex-spring-boot-starter = { module = "com.mybatis-flex:mybatis-flex-spring-boot-starter", version.ref = "mybatis-flex-core" }
mybatis-flex-spring-boot3-starter = { module = "com.mybatis-flex:mybatis-flex-spring-boot3-starter", version.ref = "mybatis-flex-core" }
mybatis-flex-spring-boot4-starter = { module = "com.mybatis-flex:mybatis-flex-spring-boot4-starter", version.ref = "mybatis-flex-core" }
mybatis-flex-kotlin-extensions = { module = "com.mybatis-flex:mybatis-flex-kotlin-extensions", version.ref = "mybatis-flex-kotlin-extensions" }

# PageHelper分页插件
pagehelper = { module = "com.github.pagehelper:pagehelper", version = "6.1.0" }
pagehelper-spring-boot-starter = { module = "com.github.pagehelper:pagehelper-spring-boot-starter", version = "2.1.0" }

# Spring Boot相关
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }

# HikariCP数据库连接池
hikariCP = { module = "com.zaxxer:HikariCP", version.ref = "hikariCP" }
# 解决ORACLE字符集不支持导致的错误
orai18n = { module = "com.oracle.database.nls:orai18n", version.ref = "orai18n" }


# auth0-java-jwt 依赖，用于JWT认证
auth0-java-jwt = { group = "com.auth0", name = "java-jwt", version.ref = "auth0-jwt" }

# okhttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
# okhttp日志拦截器
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
quartz = { module = "org.quartz-scheduler:quartz", version.ref = "quartz" }
# 对象连接池库
commons-pool2 = { module = "org.apache.commons:commons-pool2", version.ref = "commons-pool2" }
# sshj 提供SSH 客户端功能
#包含 SSH 连接和认证
#SFTP 文件传输
#SCP 文件传输
#端口转发
#远程命令执行
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }

# zip4j 用于处理zip文件
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# BouncyCastle 加密库 (用于 SM2/SM3 等国密算法)
bouncycastle-bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
springboot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 添加 GraalVM Native 插件
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
