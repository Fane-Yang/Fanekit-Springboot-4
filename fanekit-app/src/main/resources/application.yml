spring:
  threads:
    virtual:
      # 启用虚拟线程
      enabled: true
  profiles:
    active: local
  config:
    import:
      - file:config/${spring.profiles.active}/knife4j.yml
      - file:config/${spring.profiles.active}/mybatis-flex.yml
      - file:config/${spring.profiles.active}/db.yml
      - file:config/${spring.profiles.active}/redis.yml
      - file:config/${spring.profiles.active}/kafka.yml
      - file:config/${spring.profiles.active}/snowflake.yml
      - file:config/${spring.profiles.active}/log.yml
  mvc:
    path-match:
      matching-strategy: ant_path_matcher
  application:
    name: fanekit-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  webflux:
    base-path: "/api"

server:
  port: 20123
app:
  version: 1.0.0
